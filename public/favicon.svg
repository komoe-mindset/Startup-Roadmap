<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  
  <!-- Dark Badge Background for High Visibility in all browser themes -->
  <rect width="100" height="100" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Modern Rocket Vector -->
  <g transform="translate(18, 14) scale(0.68)">
    <!-- Rocket Thruster Flames -->
    <path d="M 22 74 C 18 84 10 90 24 96 C 28 88 32 82 28 74 Z" fill="url(#flameGrad)" />
    <path d="M 32 74 C 36 86 44 92 30 96 C 26 88 24 82 28 74 Z" fill="url(#flameGrad)" opacity="0.8"/>
    <path d="M 27 74 C 27 82 25 86 27 90 C 29 86 27 82 27 74 Z" fill="#fef08a" />

    <!-- Rocket Body Fins -->
    <path d="M 12 52 L 2 64 C 2 68 8 72 16 70 L 22 56 Z" fill="#64748b" />
    <path d="M 52 52 L 62 64 C 62 68 56 72 48 70 L 42 56 Z" fill="#64748b" />

    <!-- Rocket Fuselage -->
    <path d="M 32 6 C 48 20 50 48 42 68 L 22 68 C 14 48 16 20 32 6 Z" fill="url(#rocketGrad)" />
    
    <!-- Rocket Porthole Window -->
    <circle cx="32" cy="34" r="8" fill="#0f172a" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="30" cy="32" r="3" fill="#38bdf8"/>
    
    <!-- Speed Sparkles -->
    <path d="M 58 16 L 62 20 L 58 24 L 54 20 Z" fill="#facc15" />
    <circle cx="8" cy="36" r="3" fill="#38bdf8" />
  </g>
</svg>
